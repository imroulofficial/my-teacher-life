<!doctype html>
<html><head><meta charset="utf-8"><title>App icon</title>
<link rel="stylesheet" href="_fonts.css">
<style>
  body { width: 512px; height: 512px; overflow: hidden; background: transparent; }
  .icon { width: 512px; height: 512px; position: relative; overflow: hidden; }
  .rounded .icon { border-radius: 96px; }
  svg { display: block; }
</style></head>
<body>
<!-- Play Store icons are uploaded as a full square; Google applies the rounded mask itself.
     Open with ?rounded=1 to render a pre-rounded variant (transparent corners). -->
<div class="icon" id="icon"></div>
<script src="_art.js"></script>
<script>
  if (new URLSearchParams(location.search).get('rounded')) document.body.classList.add('rounded');
  const A = window.MTL_ART;
  document.getElementById('icon').innerHTML = `
  <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    ${A.defs}
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B35"/><stop offset="0.6" stop-color="#FF9F1C"/><stop offset="1" stop-color="#FFC93C"/></linearGradient>
      <radialGradient id="shine" cx="0.3" cy="0.2" r="0.7"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#shine)"/>
    <circle cx="430" cy="80" r="70" fill="#fff" opacity="0.08"/>
    <circle cx="70" cy="450" r="90" fill="#fff" opacity="0.07"/>
    <g transform="translate(96 92)">${A.board('A+')}</g>
    <g transform="translate(250 372) rotate(-32)">${A.pen}</g>
    <text x="256" y="478" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="44" letter-spacing="6"
      fill="#fff" stroke="#c2410c" stroke-width="8" paint-order="stroke">MTL</text>
  </svg>`;
</script>
</body></html>
