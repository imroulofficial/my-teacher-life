<!doctype html>
<html><head><meta charset="utf-8"><title>Screenshot frame</title>
<link rel="stylesheet" href="_fonts.css">
<style>
  /* Rendered at 360x640 CSS px with deviceScaleFactor 3 = 1080x1920.
     Top 80 px (240 px): caption strip. Below: the real game capture (1080x1680) at 1:1 pixels. */
  body { width: 360px; height: 640px; overflow: hidden; background: #fff; font-family: 'Fredoka', 'Baloo Da 2', sans-serif; }
  .cap { position: relative; height: 80px; display: flex; align-items: center; gap: 10px; padding: 0 14px; overflow: hidden;
         background: radial-gradient(circle at 12% 0%, rgba(255,255,255,.35), transparent 45%), linear-gradient(115deg, #FF6B35 0%, #FF9F1C 50%, #FFD23F 100%);
         box-shadow: inset 0 -3px 0 rgba(194,65,12,.35); }
  .cap::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.18) 1.2px, transparent 1.6px); background-size: 14px 14px; }
  .lead { position: relative; flex-shrink: 0; }
  .lead img { display: block; width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 3px 0 #c2410c; }
  .lead .icon { font-size: 40px; line-height: 1; filter: drop-shadow(0 3px 2px rgba(124,45,18,.35)); }
  .txt { position: relative; min-width: 0; flex: 1; }
  .title { display: flex; align-items: center; gap: 8px; color: #fff; font-weight: 700; font-size: 25px; line-height: 1.05; white-space: nowrap;
           -webkit-text-stroke: 1px #c2410c; text-shadow: 0 3px 0 #c2410c; }
  .new { flex-shrink: 0; padding: 2px 8px; border-radius: 999px; background: #ef3b4d; color: #fff; font-size: 13px; letter-spacing: 1px;
         -webkit-text-stroke: 0; text-shadow: none; box-shadow: 0 2px 0 #9f1239; }
  .sub { margin-top: 5px; color: #7c2d12; font-weight: 600; font-size: 13.5px; line-height: 1.2; }
  .bn { font-family: 'Baloo Da 2', 'Fredoka', sans-serif; }
  .shot { display: block; width: 360px; height: 560px; }
</style></head>
<body>
  <div class="cap"><div class="lead" id="lead"></div><div class="txt"><div class="title" id="title"></div><div class="sub" id="sub"></div></div></div>
  <img class="shot" id="shot" alt="">
<script>
  // Everything comes from the URL hash: #{"shot":"file:///...png","title":"...","sub":"...","isNew":true,"badge":true,"icon":"👑"}
  const o = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  const lead = document.getElementById('lead');
  if (o.badge) lead.innerHTML = '<img src="../badge-120levels.png" alt="">';
  else if (o.icon) lead.innerHTML = `<div class="icon">${o.icon}</div>`;
  const title = document.getElementById('title');
  if (o.isNew) title.insertAdjacentHTML('beforeend', '<span class="new">NEW</span>');
  title.insertAdjacentHTML('beforeend', `<span class="${o.bnTitle ? 'bn' : ''}">${o.title}</span>`);
  const sub = document.getElementById('sub');
  sub.textContent = o.sub;
  if (o.bnSub) sub.classList.add('bn');
  document.getElementById('shot').src = o.shot;
  // Shrink a long title until it fits on one line.
  document.fonts.ready.then(() => {
    for (let size = 25; title.scrollWidth > title.clientWidth && size > 16; size--) title.style.fontSize = size - 1 + 'px';
  });
</script>
</body></html>
