<!doctype html>
<html><head><meta charset="utf-8"><title>App icon</title>
<link rel="stylesheet" href="_fonts.css">
<style>
  html, body { width: 512px; height: 512px; overflow: hidden; background: transparent; }
  .icon { width: 512px; height: 512px; overflow: hidden; }
  .rounded .icon { border-radius: 96px; }
  .circle .icon { border-radius: 50%; }
  svg { display: block; }
</style></head>
<body>
<!--
  My Teacher Life app icon: a friendly teacher waving a red pen.
  Query options (used by generate-icons.mjs):
    ?text=0          no "My Teacher Life" ribbon
    ?minimal=1       no classroom extras (chalkboard, star, books) - for small launcher sizes
    ?shape=rounded   rounded-square with transparent corners
    ?shape=circle    circle with transparent corners (ic_launcher_round)
    ?layer=fg        adaptive-icon foreground: character only, transparent, inside the safe zone
    ?layer=bg        adaptive-icon background: gradient only
-->
<div class="icon" id="icon"></div>
<script>
const q = new URLSearchParams(location.search);
const showText = q.get('text') !== '0';
const layer = q.get('layer') || 'full';
const minimal = q.get('minimal') === '1';
const shape = q.get('shape');
if (shape) document.body.classList.add(shape);

const OUT = '#4a2210'; // cartoon outline colour

const defs = `
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="#FFD23F"/><stop offset="0.45" stop-color="#FF9F1C"/><stop offset="1" stop-color="#FF6B35"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5"><stop offset="0" stop-color="#fff7c2" stop-opacity="0.85"/><stop offset="1" stop-color="#fff7c2" stop-opacity="0"/></radialGradient>
  <radialGradient id="skin" cx="0.42" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFE4CC"/><stop offset="0.7" stop-color="#FCC9A2"/><stop offset="1" stop-color="#EFA77C"/></radialGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A3E1D"/><stop offset="1" stop-color="#4F2410"/></linearGradient>
  <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3FD0BC"/><stop offset="1" stop-color="#1C9A8A"/></linearGradient>
  <linearGradient id="pen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF7A85"/><stop offset="0.5" stop-color="#EF3B4D"/><stop offset="1" stop-color="#B3132A"/></linearGradient>
  <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A7360"/><stop offset="1" stop-color="#1C3A30"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#9a3412" flood-opacity="0.45"/></filter>
</defs>`;

const background = `
  <rect width="512" height="512" fill="url(#bg)"/>
  <g opacity="0.16" fill="#fff">
    ${Array.from({ length: 12 }, (_, i) => `<path d="M256 220 L${256 + 600 * Math.cos((i * 30 - 4) * Math.PI / 180)} ${220 + 600 * Math.sin((i * 30 - 4) * Math.PI / 180)} L${256 + 600 * Math.cos((i * 30 + 8) * Math.PI / 180)} ${220 + 600 * Math.sin((i * 30 + 8) * Math.PI / 180)} Z"/>`).join('')}
  </g>
  <circle cx="256" cy="230" r="220" fill="url(#glow)"/>`;

// Subtle classroom elements around the edges (only on the full icon)
const classroom = `
  <g transform="rotate(-8 70 70)" opacity="0.95">
    <rect x="-40" y="-30" width="170" height="130" rx="22" fill="#B45309" stroke="${OUT}" stroke-width="6"/>
    <rect x="-28" y="-18" width="146" height="104" rx="14" fill="url(#board)"/>
    <path d="M20 40 q18 -16 36 0 t36 0" stroke="#F8FAFC" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.85"/>
  </g>
  <g transform="translate(436 92) rotate(14)">
    <path d="M0 -40 L11 -13 L40 -12 L17 7 L25 36 L0 19 L-25 36 L-17 7 L-40 -12 L-11 -13 Z" fill="#FFF3A3" stroke="${OUT}" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <g transform="translate(18 372) rotate(-10)">
    <rect x="0" y="40" width="112" height="34" rx="8" fill="#4D96FF" stroke="${OUT}" stroke-width="6"/>
    <rect x="10" y="4" width="100" height="36" rx="8" fill="#9B5DE5" stroke="${OUT}" stroke-width="6"/>
    <rect x="18" y="14" width="70" height="7" rx="3.5" fill="#fff" opacity="0.55"/>
  </g>`;

const teacher = `
  <g filter="url(#shadow)">
    <!-- hair back + bun -->
    <circle cx="256" cy="118" r="50" fill="url(#hair)" stroke="${OUT}" stroke-width="7"/>
    <ellipse cx="256" cy="258" rx="132" ry="136" fill="url(#hair)" stroke="${OUT}" stroke-width="7"/>
    <!-- body -->
    <path d="M86 520 C 92 432, 166 392, 256 392 C 346 392, 420 432, 426 520 Z" fill="url(#top)" stroke="${OUT}" stroke-width="7"/>
    <path d="M222 394 L256 452 L290 394 Z" fill="#fff" stroke="${OUT}" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="256" cy="476" r="7" fill="#FFD23F" stroke="${OUT}" stroke-width="4"/>
    <!-- neck -->
    <path d="M230 352 L230 398 Q256 412 282 398 L282 352 Z" fill="#EFA77C" stroke="${OUT}" stroke-width="6"/>
    <!-- ears -->
    <circle cx="152" cy="286" r="20" fill="url(#skin)" stroke="${OUT}" stroke-width="6"/>
    <circle cx="360" cy="286" r="20" fill="url(#skin)" stroke="${OUT}" stroke-width="6"/>
    <!-- face -->
    <ellipse cx="256" cy="276" rx="104" ry="106" fill="url(#skin)" stroke="${OUT}" stroke-width="7"/>
    <!-- fringe -->
    <path d="M150 262 C 140 178, 196 146, 258 148 C 326 150, 372 186, 362 262 C 340 214, 300 196, 262 210 C 230 190, 176 208, 150 262 Z" fill="url(#hair)" stroke="${OUT}" stroke-width="6" stroke-linejoin="round"/>
    <path d="M200 176 Q236 160 270 168" stroke="#A65A2E" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- cheeks -->
    <ellipse cx="190" cy="318" rx="20" ry="12" fill="#FF7A7A" opacity="0.55"/>
    <ellipse cx="322" cy="318" rx="20" ry="12" fill="#FF7A7A" opacity="0.55"/>
    <!-- eyes -->
    <ellipse cx="214" cy="276" rx="15" ry="20" fill="#2B1A12"/>
    <ellipse cx="298" cy="276" rx="15" ry="20" fill="#2B1A12"/>
    <circle cx="219" cy="268" r="6" fill="#fff"/><circle cx="303" cy="268" r="6" fill="#fff"/>
    <!-- glasses -->
    <g fill="none" stroke="#E63946" stroke-width="8">
      <circle cx="214" cy="276" r="34"/><circle cx="298" cy="276" r="34"/>
      <path d="M248 272 Q256 264 264 272"/>
    </g>
    <!-- brows -->
    <path d="M190 226 Q212 214 236 224" stroke="${OUT}" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M276 224 Q300 214 322 226" stroke="${OUT}" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- smile -->
    <path d="M216 322 Q256 372 296 322 Q256 334 216 322 Z" fill="#8B1E2B" stroke="${OUT}" stroke-width="6" stroke-linejoin="round"/>
    <path d="M238 343 Q256 356 274 343 Q256 336 238 343 Z" fill="#FF8A8A"/>
    <!-- waving arm with red pen -->
    <path d="M392 450 C 420 420, 432 380, 430 330" stroke="${OUT}" stroke-width="58" fill="none" stroke-linecap="round"/>
    <path d="M392 450 C 420 420, 432 380, 430 330" stroke="url(#top)" stroke-width="44" fill="none" stroke-linecap="round"/>
    <g transform="translate(436 238) rotate(18)">
      <rect x="-15" y="-80" width="30" height="120" rx="12" fill="url(#pen)" stroke="${OUT}" stroke-width="6"/>
      <rect x="-15" y="-48" width="30" height="14" fill="#FFD23F" stroke="${OUT}" stroke-width="4"/>
      <path d="M-13 -80 L0 -112 L13 -80 Z" fill="#FFE8C8" stroke="${OUT}" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-4 -102 L0 -112 L4 -102 Z" fill="#B3132A"/>
      <rect x="-8" y="-70" width="6" height="90" rx="3" fill="#fff" opacity="0.45"/>
    </g>
    <circle cx="432" cy="304" r="34" fill="url(#skin)" stroke="${OUT}" stroke-width="7"/>
    <path d="M410 292 q-4 -26 16 -30" stroke="${OUT}" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>`;

const ribbon = `
  <g filter="url(#shadow)">
    <rect x="96" y="436" width="320" height="58" rx="29" fill="#E63946" stroke="${OUT}" stroke-width="6"/>
    <rect x="112" y="444" width="288" height="14" rx="7" fill="#fff" opacity="0.25"/>
    <text x="256" y="477" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="31" fill="#fff"
      stroke="${OUT}" stroke-width="5" paint-order="stroke">My Teacher Life</text>
  </g>`;

let body;
if (layer === 'bg') {
  body = background;
} else if (layer === 'fg') {
  // Adaptive foreground: 108dp canvas, visible area is the central 72dp (66%).
  // Scale the character so it sits inside that area, shoulders touching its bottom.
  body = `<g transform="translate(256 256) scale(0.64) translate(-256 -236)">${teacher}</g>`;
} else {
  body = background + (minimal ? '' : classroom) + teacher + (showText ? ribbon : '');
}

document.getElementById('icon').innerHTML =
  `<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">${defs}${body}</svg>`;
</script>
</body></html>
