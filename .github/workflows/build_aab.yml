name: Build signed Android App Bundle (AAB)

on:
  push:
    branches: [main]
  workflow_dispatch: # also lets you start a build manually from the Actions tab

concurrency:
  group: build-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2a. Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: 2b. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 3. npm install
        run: npm install

      - name: 4. npm run build
        run: npm run build

      - name: 5. npx cap sync android
        run: npx cap sync android

      - name: Restore release keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Keystore restored - the bundle will be signed."
          else
            echo "::warning title=Unsigned build::Secret ANDROID_KEYSTORE_BASE64 is not set. The AAB will be UNSIGNED and cannot be uploaded to Google Play. See README.md > Signing."
          fi

      - name: 6. Build release bundle (gradlew bundleRelease)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: 7. Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-teacher-life-${{ env.VERSION_NAME }}-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
